name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22"

jobs:
  typecheck-lint:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run check:error-handling

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test

  test-evals:
    name: Agent Evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:evals

  test-rls:
    name: RLS Isolation Tests
    runs-on: ubuntu-latest
    env:
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      TEST_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Verify test project is not production
        run: |
          if [ -z "$TEST_SUPABASE_URL" ]; then
            echo "::error::TEST_SUPABASE_URL secret is not set. RLS tests cannot run without test project credentials."
            exit 1
          fi
          if echo "$TEST_SUPABASE_URL" | grep -q "vvcuennzifsovbbylolx"; then
            echo "::error::TEST_SUPABASE_URL points at the production project. RLS tests must run against the test project only."
            exit 1
          fi
      - name: Verify all required secrets are present
        run: |
          if [ -z "$TEST_SUPABASE_ANON_KEY" ] || [ -z "$TEST_SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Missing TEST_SUPABASE_ANON_KEY or TEST_SUPABASE_SERVICE_ROLE_KEY. RLS tests require all three test project secrets."
            exit 1
          fi
      - run: npm run test:rls
